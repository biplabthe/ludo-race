<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo & Snakes</title>
<meta name="description" content="Ludo and Snakes & Ladders for 2-4 players — vs computer, on one device, or online with friends. लूडो और साँप-सीढ़ी।">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e9e4a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful family board games, bright and warm
   IDEA: real game boards resting on a felt table, framed in wood
   PICTURE: the live board itself, top and large
   COLOUR+TYPE: felt green ground, classic four house colours, Baloo 2 (Latin + Devanagari)
   LAYOUT: board left, dice + timer + standings right; stacks under 860px */
:root{color-scheme:light dark;--bg:light-dark(#d9ebe2,#0a1f1a);--bg2:light-dark(#c4dfd2,#06140f);--ink:light-dark(#11241d,#eef6f2);--card:light-dark(#ffffff,#12302a);--mute:light-dark(#4c675d,#9dbbb0);--line:light-dark(#cfe0d8,#21443b);--soft:light-dark(#f1f6f3,#0e2722)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 30% 20%,var(--bg),var(--bg2));min-height:100vh;color:var(--ink);font:16px/1.5 "Baloo 2",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1120px;margin:0 auto;padding:16px max(3vw,14px) 4px}
h1{margin:0;font-size:clamp(26px,4vw,38px);line-height:1.05;font-weight:800}
h1 span{font-size:15px;font-weight:600;color:var(--mute);margin-left:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:6px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--mute)}
.btn.sm{min-height:36px;padding:2px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #f4b400;outline-offset:2px}
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;max-width:1120px;margin:0 auto;padding:12px max(3vw,14px) 32px;align-items:start}
.frame{padding:clamp(8px,1.6vw,16px);border-radius:20px;background:linear-gradient(145deg,#c98a45,#8a4f1e 55%,#6b3a12);box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.25);max-width:min(100%,calc(100vh - 90px));min-width:280px;margin:0 auto;width:100%}
.board{position:relative;aspect-ratio:1;width:100%;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.panel{display:grid;gap:14px}
.box{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.tl{font-size:14px;color:var(--mute);margin:0}
.timer{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.timer.low{color:#e2332b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.roomtag{float:right;font-weight:800;font-size:14px;background:var(--soft);border-radius:8px;padding:2px 8px}
.turnbox{display:grid;justify-items:center;gap:10px;text-align:center}
.turn{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.dice{--pc:#e2332b;width:104px;height:104px;border-radius:22px;border:5px solid var(--pc);background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;gap:4px;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18),0 12px 24px rgba(0,0,0,.2);transition:transform .1s}
.dice:active{transform:translateY(3px)}
.dice i{display:block;border-radius:50%;margin:3px}
.dice i.on{background:#18211e;box-shadow:inset 0 2px 2px rgba(255,255,255,.3)}
.dice.ready{animation:bob 1s ease-in-out infinite}
.dice.roll{animation:shake .12s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-4px)}100%{transform:rotate(-12deg)}}
.msg{margin:0;min-height:48px;color:var(--mute);font-weight:600}
.tt{margin:0;font-size:14px;font-weight:700;color:#c47f00;min-height:1.2em}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:2px solid transparent}
.plist li.cur{border-color:var(--line);background:color-mix(in srgb,var(--card) 80%,#f4b400)}
.plist b{font-size:18px}
.who{display:flex;align-items:center;gap:6px}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-weight:600;color:var(--mute)}
.nm small.fin{color:#1e9e4a}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.hc{font-weight:700;font-size:14px;white-space:nowrap}
.rules{font-size:14px;color:var(--mute);margin:0}
.modal{position:fixed;inset:0;background:rgba(5,20,15,.6);display:grid;place-items:center;padding:16px;z-index:5;overflow:auto}
.hidden{display:none}
.card{position:relative;background:var(--card);border-radius:22px;padding:22px;width:min(580px,100%);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.card h2{margin:0 0 8px;font-size:32px;line-height:1.05;padding-right:48px}
.x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:800;line-height:1;cursor:pointer;display:grid;place-items:center}
.x:hover{border-color:var(--mute)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.games input{position:absolute;opacity:0}
.games span{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 12px;border-radius:16px;border:3px solid var(--line);cursor:pointer;font-weight:800;font-size:18px;line-height:1.15}
.games svg{width:40px;height:40px;flex:none}
.games input:checked+span{border-color:#f4b400;background:color-mix(in srgb,var(--card) 82%,#f4b400)}
.games input:focus-visible+span{outline:3px solid #f4b400}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--soft);padding:5px;border-radius:14px}
.tabs button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:800;cursor:pointer;line-height:1.15}
.tabs button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.lbl{margin:14px 0 6px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg input{position:absolute;opacity:0}
.seg input+span{display:block;min-height:44px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);cursor:pointer;font-weight:800;line-height:1.2}
.seg small{display:block;font-weight:500;color:var(--mute);font-size:13px;margin-top:2px}
.seg input:checked+span{border-color:#1e9e4a;background:color-mix(in srgb,var(--card) 82%,#1e9e4a)}
.seg input:focus-visible+span{outline:3px solid #f4b400}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) 130px;gap:8px;align-items:center;margin-bottom:8px}
.sw{width:28px;height:28px;border-radius:8px;flex:none}
.inp,.prow input,.prow select{min-height:44px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:16px;width:100%}
.inp.code{text-transform:uppercase;letter-spacing:2px;font-weight:800}
.rule,.note{font-size:14px;color:var(--mute)}
.err{color:#e2332b;font-weight:700;min-height:1.4em;margin:6px 0}
.big{width:100%;min-height:54px;border:0;border-radius:14px;background:#1e9e4a;color:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0f6a2f;margin-top:12px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #0f6a2f}
.big:disabled{opacity:.5;cursor:not-allowed}
.row2{display:flex;gap:8px;align-items:center}.row2>.inp{flex:1}
.or{text-align:center;color:var(--mute);font-size:14px;margin:12px 0 6px}
.login{display:grid;gap:8px;margin-top:12px}
.fb{min-height:50px;border:0;border-radius:12px;background:#1877f2;color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.gg{min-height:50px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#222;font-weight:800;font-size:17px;cursor:pointer}
.me{display:flex;align-items:center;gap:10px;margin:12px 0;padding:8px 10px;border-radius:12px;background:var(--soft)}
.me b{flex:1}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:8px;min-height:44px}
.chk input{width:22px;height:22px}
.live{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px;max-height:240px;overflow:auto}
.live li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:var(--soft)}
.live .nm{flex:1}
.live .st{font-size:13px;color:var(--mute);white-space:nowrap}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ecc71;margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,#2ecc71 30%,transparent)}
.share{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.share .inp{flex:1 1 200px;font-size:14px}
.wa{background:#25d366;color:#fff;border-color:#25d366}
.seats{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.seats li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--soft);min-height:48px}
.seats small{color:var(--mute);font-weight:600}
.mute{color:var(--mute)}
.rlist{list-style:none;padding:0;margin:12px 0 18px;display:grid;gap:8px}
.rlist li{display:grid;grid-template-columns:64px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft)}
.medal{font-weight:800;text-align:center;border-radius:10px;padding:2px 0;color:#1b1b1b}
.m0{background:#ffd54a}.m1{background:#d5dbe0}.m2{background:#e3a26c}.m3{background:#c9d6d0}
.st{font-size:14px;color:var(--mute);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;width:min(420px,calc(100% - 24px));background:var(--card);border-radius:18px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.45);border:3px solid #1e9e4a;display:grid;gap:10px}
.toast .row2>*{flex:1}
@media(max-width:860px){.game{grid-template-columns:minmax(0,1fr)}.frame{max-width:640px}}
@media(max-width:520px){.seg{grid-template-columns:minmax(0,1fr)}.games span{font-size:16px}.prow{grid-template-columns:28px minmax(0,1fr) 110px}.timer{font-size:36px}.rlist li{grid-template-columns:56px auto minmax(0,1fr)}.rlist .st{grid-column:3}.card{padding:16px}}
@media(prefers-reduced-motion:reduce){.dice.ready,.timer.low{animation:none}}
</style>
</head>
<body>
<header class="top">
  <h1><span data-t="appTitle" style="font-size:inherit;color:inherit;margin:0">Ludo</span> <span data-t="appSub"></span></h1>
  <div class="tools"><button class="btn" id="langBtn">English</button><button class="btn" id="snd"></button><button class="btn" id="newg" data-t="newGame"></button></div>
</header>
<main class="game">
  <div class="frame"><div class="board" id="board"><canvas id="cv" aria-label="Game board"></canvas></div></div>
  <aside class="panel">
    <div class="box"><span class="roomtag" id="roomtag" hidden></span><p class="tl" id="tlabel"></p><div class="timer" id="timer">00:00</div></div>
    <div class="box turnbox">
      <div class="turn" id="turn"></div>
      <button class="dice" id="dice" aria-label="Roll dice"></button>
      <p class="msg" id="msg"></p>
      <p class="tt" id="tt"></p>
    </div>
    <div class="box"><p class="tl" style="margin-bottom:8px" data-t="ranking"></p><ol class="plist" id="plist"></ol></div>
    <p class="rules" id="rules"></p>
  </aside>
</main>

<div class="modal" id="home"><div class="card">
  <button class="x" id="homeX" aria-label="Close">✕</button>
  <h2 data-t="playTitle"></h2>
  <div class="games">
    <label><input type="radio" name="game" value="ludo" checked><span><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="20" height="20" fill="#e2332b"/><rect x="20" width="20" height="20" fill="#1e9e4a"/><rect x="20" y="20" width="20" height="20" fill="#f4b400"/><rect y="20" width="20" height="20" fill="#1f6fe0"/><circle cx="20" cy="20" r="7" fill="#fff"/></svg><b data-t="gLudo"></b></span></label>
    <label><input type="radio" name="game" value="snake"><span><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="6" fill="#fde7b0"/><path d="M8 34 L18 6 M16 34 L26 6" stroke="#8a4f1e" stroke-width="3"/><path d="M12 28 L22 28 M14 21 L24 21 M17 13 L26 13" stroke="#8a4f1e" stroke-width="2.5"/><path d="M33 8 C20 14 36 22 22 30 C16 33 12 32 10 34" stroke="#1e9e4a" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="33" cy="8" r="4" fill="#1e9e4a"/></svg><b data-t="gSnake"></b></span></label>
  </div>
  <div class="tabs" role="tablist">
    <button data-tab="bot" class="on" data-t="tabBot"></button>
    <button data-tab="local" data-t="tabLocal"></button>
    <button data-tab="online" data-t="tabOnline"></button>
  </div>
  <p class="lbl" data-t="mode"></p>
  <div class="seg">
    <label><input type="radio" name="mode" value="c" checked><span><span data-t="mClassic"></span><small data-t="mClassicS"></small></span></label>
    <label><input type="radio" name="mode" value="r2"><span><span data-t="mR2"></span><small data-t="mR2s"></small></span></label>
    <label><input type="radio" name="mode" value="r10"><span><span data-t="mR10"></span><small data-t="mR10s"></small></span></label>
  </div>
  <section data-pane="bot">
    <p class="lbl" data-t="yourName"></p>
    <input class="inp" id="bname" maxlength="16" data-tp="you">
    <p class="lbl" data-t="howManyBots"></p>
    <div class="seg">
      <label><input type="radio" name="bots" value="1" checked><span><span data-t="bots1"></span><small data-t="bots1s"></small></span></label>
      <label><input type="radio" name="bots" value="2"><span><span data-t="bots2"></span></span></label>
      <label><input type="radio" name="bots" value="3"><span><span data-t="bots3"></span><small data-t="bots3s"></small></span></label>
    </div>
    <button class="big" id="bstart" data-t="start"></button>
  </section>
  <section data-pane="local" hidden>
    <p class="lbl" data-t="localPlayers"></p>
    <div id="prows"></div>
    <p class="err" id="serr"></p>
    <button class="big" id="lstart" data-t="start"></button>
  </section>
  <section data-pane="online" hidden><div id="onl"></div></section>
  <p class="rule" data-t="rankRule"></p>
</div></div>

<div class="modal hidden" id="lobby"><div class="card" id="lob"></div></div>

<div class="modal hidden" id="result"><div class="card">
  <button class="x" id="resX" aria-label="Close">✕</button>
  <h2 id="rtitle"></h2>
  <ol class="rlist" id="rlist"></ol>
  <p class="note" id="rnote"></p>
  <div class="row2"><button class="btn" id="rclose" style="flex:1" data-t="viewBoard"></button><button class="big" id="ragain" style="flex:2;margin:0"></button></div>
</div></div>

<div class="toast" id="toast" hidden></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let gen=0;
const sleep=ms=>{const g=gen;return new Promise((res,rej)=>setTimeout(()=>g===gen?res():rej('stale'),ms))};

/* ---------- Language ---------- */
const TX={
hi:{appTitle:'लूडो',appSub:'और साँप-सीढ़ी',newGame:'नया गेम',soundOn:'आवाज़: चालू',soundOff:'आवाज़: बंद',langBtn:'English',
 timeClassic:'क्लासिक — खेल का समय',timeRace:'रेस ({m} मिनट) — समय बचा',chooseGame:'गेम चुनें',turnOf:'{n} की बारी',gameOver:'खेल खत्म',rollHint:'"नया गेम" दबाकर खेल शुरू करें',
 ranking:'रैंकिंग (लाइव)',rulesLudo:'6 आने पर गोटी बाहर निकलती है · 6, किसी को काटने या घर पहुँचने पर दोबारा बारी · लगातार तीन 6 पर बारी जाती है · तारे वाले खाने सुरक्षित हैं',
 rulesSnake:'सीढ़ी मिले तो ऊपर चढ़ो, साँप मिले तो नीचे · 100 पर ठीक-ठीक पहुँचना है · 6 आने पर दोबारा बारी · लगातार तीन 6 पर बारी जाती है',
 home2:'घर {h}/4',cell:'खाना {c}',botTag:'कंप्यूटर',youTag:'(आप)',finTag:'पूरा',playTitle:'खेलें',gLudo:'लूडो',gSnake:'साँप-सीढ़ी',
 tabBot:'कंप्यूटर के साथ',tabLocal:'साथ बैठकर',tabOnline:'ऑनलाइन दोस्त',mode:'मोड चुनें',mClassic:'क्लासिक',mClassicS:'पूरा खेल',mR2:'रेस 2 मिनट',mR2s:'तेज़ मुकाबला',mR10:'रेस 10 मिनट',mR10s:'लंबी रेस',
 yourName:'आपका नाम',you:'आप',howManyBots:'कितने कंप्यूटर खिलाड़ी?',bots1:'1 बॉट',bots1s:'आमने-सामने',bots2:'2 बॉट',bots3:'3 बॉट',bots3s:'पूरे 4',start:'खेल शुरू करें',
 localPlayers:'खिलाड़ी (एक ही फ़ोन पर बारी-बारी)',human:'इंसान',bot:'कंप्यूटर',off:'बंद',min2:'कम से कम 2 खिलाड़ी चुनें',
 rankRule:'रैंकिंग: जो पहले खेल पूरा करे वो पहला। रेस में समय खत्म होने पर जो सबसे आगे है वो ऊपर।',
 c0:'लाल',c1:'हरा',c2:'पीला',c3:'नीला',botName:'कंप्यूटर {c}',
 n_three6:'लगातार तीन बार 6! बारी गई',n_nomove:'{d} आया — कोई चाल नहीं',n_six:'6 आया, फिर से बारी!',n_cut:'{n} ने गोटी काटी! फिर से बारी',n_home:'गोटी घर पहुँची! फिर से बारी',
 n_place:'{n} {o} स्थान पर!',n_ladder:'{n} सीढ़ी चढ़ा! {a} → {b}',n_snake:'{n} को साँप ने काटा! {a} → {b}',n_over:'100 तक पहुँचने के लिए सही नंबर चाहिए',n_time:'समय खत्म!',n_done:'खेल खत्म!',

const TINTS=['#ffe9b3','#d3efdc','#ffd6d1','#d5e4fc'];
const SNC=[['#2f9e44','#1b6e2c','#b8f0a6'],['#d9480f','#9a2f07','#ffc9a8'],['#7048e8','#4527a0','#d0bfff'],['#e8590c','#a63c06','#ffe066'],['#0c8599','#085c69','#99e9f2']];
function drawSnakeBoard(c){const V=W/10;c.setTransform(V,0,0,V,0,0);
 for(let n=1;n<=100;n++){const[x,y]=cellXY(n);const r=Math.floor((n-1)/10);c.fillStyle=TINTS[(r+Math.floor(x))%4];c.fillRect(x-.5,y-.5,1,1)}
 c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=.025;for(let i=0;i<=10;i++){c.beginPath();c.moveTo(i,0);c.lineTo(i,10);c.moveTo(0,i);c.lineTo(10,i);c.stroke()}
 // numbers in pixel space
 c.setTransform(1,0,0,1,0,0);c.fillStyle='rgba(30,40,35,.75)';c.font=`700 ${Math.max(9,V*.24)}px "Baloo 2",sans-serif`;c.textBaseline='top';
 for(let n=1;n<=100;n++){const[x,y]=cellXY(n);c.fillText(String(n),(x-.45)*V,(y-.47)*V)}
 c.setTransform(V,0,0,V,0,0);
 // ladders
 for(const[a,b]of Object.entries(LAD)){const[x1,y1]=cellXY(+a),[x2,y2]=cellXY(+b);const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len*.17,ny=dx/len*.17;
  c.lineCap='round';c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=.13;

  c.strokeStyle='#8a4f1e';c.lineWidth=.09;const steps=Math.max(2,Math.floor(len/.42));
  for(let i=1;i<steps;i++){const q=i/steps,px=x1+dx*q,py=y1+dy*q;c.beginPath();c.moveTo(px+nx,py+ny);c.lineTo(px-nx,py-ny);c.stroke()}
  c.strokeStyle='#b8742f';c.lineWidth=.1;for(const s of[1,-1]){c.beginPath();c.moveTo(x1+nx*s,y1+ny*s);c.lineTo(x2+nx*s,y2+ny*s);c.stroke()}}
 // snakes
 Object.entries(SNK).forEach(([h,tl],i)=>{const[x1,y1]=cellXY(+h),[x2,y2]=cellXY(+tl);const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,w=Math.min(1.1,len*.25);
  const p1=[x1+dx*.3+nx*w,y1+dy*.3+ny*w],p2=[x1+dx*.65-nx*w,y1+dy*.65-ny*w];const[col,dark,light]=SNC[i%SNC.length];

  const ang=Math.atan2(y1-p1[1],x1-p1[0]);c.save();c.translate(x1,y1);c.rotate(ang);
  c.beginPath();c.ellipse(0,0,.27,.2,0,0,7);c.fillStyle=col;c.fill();c.lineWidth=.04;c.strokeStyle=dark;c.stroke();
  c.strokeStyle='#e03131';c.lineWidth=.035;c.beginPath();c.moveTo(.25,0);c.lineTo(.4,0);c.lineTo(.46,-.05);c.moveTo(.4,0);c.lineTo(.46,.05);c.stroke();
  for(const s of[1,-1]){c.beginPath();c.arc(.08,.09*s,.06,0,7);c.fillStyle='#fff';c.fill();c.beginPath();c.arc(.1,.09*s,.03,0,7);c.fillStyle='#111';c.fill()}
  c.restore()});
 c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=.05;c.strokeRect(0,0,10,10)}

function drawPiece(c,x,y,r,pl,hl,tm,lift){
 c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x,y+r*.72+lift,r*Math.max(.5,.9-lift*.4),r*.36,0,0,7);c.fill();
 if(hl){const pr=r*1.3+Math.sin(tm/140)*.06;c.beginPath();c.arc(x,y,pr,0,7);c.strokeStyle='#fff';c.lineWidth=.11;c.stroke();c.strokeStyle=pl.d;c.lineWidth=.045;c.stroke()}
 const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);g.addColorStop(0,pl.l);g.addColorStop(.45,pl.c);g.addColorStop(1,pl.d);

function draw(tm){if(boardFor!==curGame())drawBoard();const c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.drawImage(bcv,0,0);
 if(!S||!D)return;const snake=S.game==='snake',Z=snake?10:15;c.setTransform(W/Z,0,0,W/Z,0,0);
 if(!snake&&!S.over){const[ox,oy]=P[S.turn].yard;c.strokeStyle=`rgba(255,255,255,${.45+.4*Math.sin(tm/220)})`;c.lineWidth=.18;c.strokeRect(ox+.14,oy+.14,5.72,5.72)}
 const items=[];
 for(const p of act(S))for(const k of snake?[0]:[0,1,2,3]){const an=AN[p*4+k];const[tx,ty]=pt(p,k);let x=tx,y=ty,lift=0,moving=false;
  if(an){const q=Math.min(1,(tm-an.t0)/an.dur);x=an.fx+(tx-an.fx)*q;y=an.fy+(ty-an.fy)*q;lift=Math.sin(q*Math.PI)*an.h;moving=q<1}
  const fin=snake?false:D[p][k]===56;items.push({p,k,x,y,lift,moving,r:snake?(D[p]<=0?.17:.3):fin?.24:.36})}
 const groups={};items.forEach(it=>{if(it.moving||(snake&&D[it.p]<=0))return;const key=Math.round(it.x*10)+','+Math.round(it.y*10);(groups[key]=groups[key]||[]).push(it)});
 Object.values(groups).forEach(g=>{const n=g.length;if(n<2)return;g.forEach((it,i)=>{const a=i/n*Math.PI*2-Math.PI/4,rr=n===2?.18:.21;it.x+=Math.cos(a)*rr;it.y+=Math.sin(a)*rr;it.r*=.68})});

 items.forEach(it=>{const hl=snake?(!S.over&&it.p===S.turn&&!it.moving):(canPick&&it.p===S.turn&&S.mv.includes(it.k));drawPiece(c,it.x,it.y-it.lift,it.r,P[it.p],hl,tm,it.lift);DR[it.p*4+it.k]=[it.x,it.y]})}

/* ---------- Turn flow (same for offline and online) ---------- */
function commit(ns){const base=S.seq;ns.seq=base+1;
 if(net){busy=true;net.ref.child('state').transaction(cur=>{if(cur&&cur.seq!==base)return;return clone(ns)},(err,ok)=>{if(err||!ok)busy=false})}
 else receive(clone(ns))}
function receive(ns){if(!ns)return;if(S&&D&&ns.gid===S.gid&&ns.seq<=S.seq)return;
 const prev=S;S=ns;lastChange=Date.now();busy=false;const g=gen;
 animQ=animQ.then(async()=>{animating=true;try{await play(prev,ns)}finally{animating=false}}).then(()=>{if(g===gen&&S===ns)after()}).catch(()=>{animating=false})}
async function hop(p,k,np,dur=170,h=.38){const key=p*4+k;const[fx,fy]=DR[key]||pt(p,k);setD(p,k,np);AN[key]={fx,fy,t0:performance.now(),dur,h};await sleep(dur+12);delete AN[key]}
async function rollAnim(d){sfx.dice();diceEl.classList.add('roll');for(let i=0;i<7;i++){showDice(1+Math.floor(Math.random()*6));await sleep(65)}diceEl.classList.remove('roll');showDice(d)}
async function play(prev,ns){
 if(!D||!prev||prev.gid!==ns.gid){D=clone(ns.game==='snake'?ns.sp:ns.pc);AN={};showDice(ns.dice||6);drawBoard();ui();if(ns.over)showEnd();return}
 const L=ns.last;ui();
 if(L.t==='roll'){await rollAnim(L.d);
  if(L.nk){if(L.nk==='three6')sfx.bad();msg(noteText(L));await sleep(950)}else if(L.d===6)sfx.six()}
 else if(L.t==='move'){const p=L.p,k=L.k;
  if(L.from<0){sfx.out();await hop(p,k,0,260,.6)}else for(let s=L.from+1;s<=L.to;s++){sfx.step();await hop(p,k,s)}
  if(L.cut.length){for(const[q,j]of L.cut){const key=q*4+j,[fx,fy]=DR[key]||pt(q,j);D[q][j]=-1;AN[key]={fx,fy,t0:performance.now(),dur:500,h:1.2}}sfx.cap();await sleep(520);L.cut.forEach(([q,j])=>delete AN[q*4+j])}
  if(L.to===56)sfx.home();
  if(L.nk)msg(noteText(L));
  if(ns.finished.length>prev.finished.length)await sleep(1000)}
 else if(L.t==='sroll'){await rollAnim(L.d);
  if(L.nk==='three6'){sfx.bad();msg(noteText(L));await sleep(950)}
  else{if(L.d===6)sfx.six();
   for(let s=L.from+1;s<=L.to;s++){sfx.step();await hop(L.p,0,s)}
   if(L.via){await sleep(150);if(L.via==='ladder')sfx.ladder();else sfx.snake();await hop(L.p,0,L.fin,L.via==='snake'?900:750,L.via==='ladder'?.2:.05)}
   if(L.fin===100)sfx.home();
   if(L.nk)msg(noteText(L));
   if(L.nk==='place')await sleep(1000);else if(L.nk==='over'||L.via)await sleep(500)}}
 D=clone(ns.game==='snake'?ns.sp:ns.pc);ui();
 if(ns.over){showEnd();return}
 if(prev.turn!==ns.turn)sfx.turn()}
function later(ms,fn){const g=gen,seq=S.seq,gid=S.gid;setTimeout(()=>{if(g===gen&&S&&S.seq===seq&&S.gid===gid&&!busy)fn()},ms)}
function prompt(){if(!S||S.over)return;const q=S.turn,pl=S.players[q],mine=isMine(q),n=dn(q);const note=noteText(S.last);const pre=note?note+' · ':'';
 if(S.phase==='roll')msg(pre+(pl.bot?t('p_thinking',{n}):mine?t('p_roll',{n}):t('p_wait',{n})));
 else if(S.phase==='move'){const same=new Set(S.mv.map(k=>S.pc[q][k])).size===1;msg(pl.bot?t('p_thinking',{n}):mine?(same?pre:t('p_pick',{d:S.dice})):t('p_moving',{n}))}}
function after(){ui();if(!S||S.over)return;prompt();const pl=S.players[S.turn],mine=isMine(S.turn),botHere=pl.bot&&amHost();
 if(S.phase==='roll'){if(botHere)later(750,doRoll)}
 else if(S.phase==='move'){const same=new Set(S.mv.map(k=>S.pc[S.turn][k])).size===1;
  if(botHere)later(600,()=>doMove(same?S.mv[0]:botPick(S)));else if(mine&&same)later(350,()=>doMove(S.mv[0]))}}
function doRoll(){if(!S||busy||S.over||S.phase!=='roll'||animating)return;busy=true;commit(eRoll(S,1+Math.floor(Math.random()*6)))}
function doMove(k){if(!S||busy||S.over||S.phase!=='move'||animating||!S.mv.includes(k))return;busy=true;commit(eMove(S,k))}
function showEnd(){sfx.win();ui();msg(t(S.reason==='time'?'n_time':'n_done'));renderResult();setTimeout(()=>{if(S&&S.over)$('#result').classList.remove('hidden')},700)}

 $('#rlist').innerHTML=ranking(S).map((q,i)=>{const x=S.players[q];return `<li><span class="medal m${i}">${esc(tl('medals',i))}</span><span class="who"><span class="dot" style="background:${P[q].c}"></span>${avatar(x.photo)}</span><span class="nm">${esc(dn(q))}</span><span class="st">${esc(snake?t('cell',{c:S.sp[q]}):t('home2',{h:homeCnt(S,q)})+' · '+t('steps',{s:prog(S,q)}))}</span></li>`}).join('');

 FB.auth.getRedirectResult().catch(onlErr);
 return FB}
async function startOnline(){if(onlState==='ready'||onlState==='loading')return renderOnline();onlState='loading';renderOnline();
 try{await initFB();onlState='ready'}catch(e){onlState='nocfg'}renderOnline();
 const rc=new URLSearchParams(location.search).get('room');if(rc&&onlState==='ready'){if($('#jcode'))$('#jcode').value=rc;if(FB.auth.currentUser&&!net)joinRoom(rc).catch(onlErr)}}
function onlErr(e){if(typeof e==='string'){onlErrKey=e;onlErrArg=''}else if(e&&e.code==='auth/popup-closed-by-user'){onlErrKey=''}else{onlErrKey='e_generic';onlErrArg=(e&&e.message)||String(e)}renderOnline()}
const errText=()=>onlErrKey?t(onlErrKey,{m:onlErrArg}):'';
const meInfo=()=>{const u=FB.auth.currentUser;return{uid:u.uid,name:(u.displayName||t('you')).slice(0,16),photo:u.photoURL||null}};
function renderOnline(){const el=$('#onl');
 if(onlState==='idle')return;
 if(onlState==='loading'){el.innerHTML=`<p class="note">${esc(t('o_loading'))}</p>`;return}
 if(onlState==='nocfg'){el.innerHTML=`<p class="note">${esc(t('o_nocfg'))}</p>`;return}
 if(!FB)return;const u=FB.auth.currentUser;
 if(!u){el.innerHTML=`<div class="login"><button class="fb" id="lfb">${esc(t('fbLogin'))}</button><button class="gg" id="lgg">${esc(t('ggLogin'))}</button><div class="or">${esc(t('orGuest'))}</div><div class="row2"><input class="inp" id="gname" placeholder="${esc(t('guestName'))}" maxlength="16"><button class="btn" id="lguest">${esc(t('play'))}</button></div></div><p class="err">${esc(errText())}</p>`;
  $('#lfb').onclick=()=>signIn(new firebase.auth.FacebookAuthProvider());
  $('#lgg').onclick=()=>signIn(new firebase.auth.GoogleAuthProvider());
  $('#lguest').onclick=async()=>{const n=$('#gname').value.trim();if(!n)return onlErr('needName');try{const c=await FB.auth.signInAnonymously();await c.user.updateProfile({displayName:n});goLive(c.user);setLive();renderOnline()}catch(e){onlErr(e)}};return}
 const me=meInfo();const others=liveList.filter(x=>x.uid!==me.uid);const code=$('#jcode')?$('#jcode').value:'';const fill=$('#fillb')?$('#fillb').checked:false;
 el.innerHTML=`<div class="me">${avatar(me.photo)}<b>${esc(me.name)}</b><button class="btn sm" id="lout">${esc(t('logout'))}</button></div>
 <label class="chk"><input type="checkbox" id="fillb" ${fill?'checked':''}> ${esc(t('fillBots'))}</label>
 <button class="big" id="mk" style="margin-top:4px">${esc(t('mkRoom'))}</button>
 <div class="or">${esc(t('orCode'))}</div>
 <div class="row2"><input class="inp code" id="jcode" value="${esc(code)}" placeholder="${esc(t('codePh'))}" maxlength="6" autocapitalize="characters"><button class="btn" id="jbtn">${esc(t('join'))}</button></div>
 <p class="lbl" style="margin-top:16px"><span class="gdot"></span>${esc(t('liveNow',{n:others.length}))}</p>
 ${others.length?`<ul class="live">${others.map(x=>`<li>${avatar(x.photo)}<span class="nm">${esc(x.name)}</span><span class="st">${esc(t(x.state==='playing'?'playing':'free'))}</span><button class="btn sm" data-inv="${esc(x.uid)}" ${x.state==='playing'?'disabled':''}>${esc(t('invite'))}</button></li>`).join('')}</ul>`:`<p class="note">${esc(t('noneOnline'))}</p>`}
 <p class="err">${esc(errText())}</p>`;
 $('#lout').onclick=async()=>{await leaveLive();await FB.auth.signOut();renderOnline()};
 $('#mk').onclick=()=>createRoom().catch(onlErr);
 $('#jbtn').onclick=()=>joinRoom($('#jcode').value).catch(onlErr);
 el.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>sendInvite(b.dataset.inv).catch(onlErr))}
async function signIn(prov){onlErrKey='';try{await FB.auth.signInWithPopup(prov)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return FB.auth.signInWithRedirect(prov);onlErr(e)}}

/* presence: who is live right now */
let liveRef=null,liveOn=false;
function goLive(u){if(liveOn)return;liveOn=true;const ref=FB.db.ref('online/'+u.uid);liveRef=ref;
 FB.db.ref('.info/connected').on('value',s=>{if(s.val()!==true||!FB.auth.currentUser)return;ref.onDisconnect().remove();setLive()});
 FB.db.ref('online').on('value',s=>{const v=s.val()||{};liveList=Object.keys(v).map(k=>({uid:k,...v[k]})).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,40);renderOnline();if(net&&net.room&&net.room.status==='lobby')renderLobby(net.room)});
 FB.db.ref('invites/'+u.uid).on('child_added',s=>showInvite(s.key,s.val()))}
function setLive(){if(!liveRef||!FB||!FB.auth.currentUser)return;const m=meInfo();liveRef.set({name:m.name,photo:m.photo,state:net&&net.inGame?'playing':'free',ts:firebase.database.ServerValue.TIMESTAMP})}
async function leaveLive(){if(!liveOn)return;const uid=FB.auth.currentUser.uid;FB.db.ref('online').off();FB.db.ref('.info/connected').off();FB.db.ref('invites/'+uid).off();await liveRef.remove();liveOn=false;liveRef=null;liveList=[]}

/* invites */
async function sendInvite(toUid){if(!net)await createRoom();const m=meInfo();const ref=FB.db.ref('invites/'+toUid+'/'+m.uid);
 await ref.set({name:m.name,photo:m.photo,code:net.code,game:(net.room&&net.room.game)||selGame(),ts:firebase.database.ServerValue.TIMESTAMP});ref.onDisconnect().remove();
 const who=liveList.find(x=>x.uid===toUid);toast(esc(t('invSent',{n:who?who.name:t('friend')})),4000)}
function showInvite(from,v){if(!v||!v.code)return;if(now()-(v.ts||0)>10*60000){FB.db.ref('invites/'+FB.auth.currentUser.uid+'/'+from).remove();return}
 sfx.invite();const el=$('#toast');el.hidden=false;el.innerHTML=`<div class="row2" style="justify-content:flex-start">${avatar(v.photo)}<span>${esc(t('invGot',{n:v.name,g:gName(v.game),c:v.code}))}</span></div><div class="row2"><button class="btn" id="idec">${esc(t('decline'))}</button><button class="big" id="iacc" style="margin:0;min-height:46px;font-size:17px">${esc(t('play'))}</button></div>`;
 const ref=FB.db.ref('invites/'+FB.auth.currentUser.uid+'/'+from);
 $('#idec').onclick=()=>{ref.remove();el.hidden=true};
 $('#iacc').onclick=()=>{ref.remove();el.hidden=true;joinRoom(v.code).catch(onlErr)}}
let toastTimer=0;function toast(h,ms){const el=$('#toast');el.hidden=false;el.innerHTML=`<div>${h}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},ms)}

/* rooms */
async function createRoom(){const m=meInfo();let code='';
 for(let i=0;i<6;i++){code=Array.from({length:6},()=>CH[Math.floor(Math.random()*CH.length)]).join('');if(!(await FB.db.ref('rooms/'+code).get()).exists())break}
 await FB.db.ref('rooms/'+code).set({host:m.uid,game:selGame(),mode:modeVal(),fill:!!($('#fillb')&&$('#fillb').checked),status:'lobby',created:firebase.database.ServerValue.TIMESTAMP,seats:{s0:m}});
 enterRoom(code)}
const seatList=r=>['s0','s1','s2','s3'].map(k=>(r.seats&&r.seats[k])||null);
async function joinRoom(code){onlErrKey='';code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return onlErr('e_code');
 if(!FB.auth.currentUser)return onlErr('e_login');
 const ref=FB.db.ref('rooms/'+code);const snap=await ref.get();if(!snap.exists())return onlErr('e_noroom');
 const r=snap.val(),m=meInfo();
 if(r.status!=='lobby'){const inGame=r.state&&r.state.players&&Object.values(r.state.players).some(p=>p&&p.uid===m.uid);if(inGame)return enterRoom(code);return onlErr('e_started')}
 let ok=false;
 await ref.child('seats').transaction(seats=>{seats=seats||{};const keys=['s0','s1','s2','s3'];if(keys.some(k=>seats[k]&&seats[k].uid===m.uid)){ok=true;return}const k=keys.find(k=>!seats[k]);if(!k){ok=false;return}ok=true;seats[k]=m;return seats});
 if(!ok)return onlErr('e_full');
 enterRoom(code)}
function enterRoom(code){A();if(net&&net.code===code)return;leaveNet();resetBoard();
 net={code,uid:FB.auth.currentUser.uid,ref:FB.db.ref('rooms/'+code),host:null,room:null,inGame:false,dc:null};
 net.ref.on('value',s=>onRoom(s.val()));
 try{history.replaceState(null,'','?room='+code)}catch(e){}}
function onRoom(r){if(!net)return;
 if(!r){leaveNet();openHome('online');onlErr('e_closed');return}
 net.host=r.host;net.room=r;
 if(r.status==='lobby'){if(net.inGame||S){net.inGame=false;resetBoard();setLive()}
  const g=r.game||'ludo';const gi=document.querySelector(`input[name=game][value=${g}]`);if(gi&&!gi.checked){gi.checked=true;drawBoard()}
  const seats=seatList(r);const mk=['s0','s1','s2','s3'].find((k,i)=>seats[i]&&seats[i].uid===net.uid);
  if(!mk){leaveNet();openHome('online');onlErr('e_kicked');return}
  if(net.dc!==mk){net.dc=mk;net.ref.child('seats/'+mk).onDisconnect().remove()}
  renderLobby(r);hideAll();$('#lobby').classList.remove('hidden');ui();return}
 if(!net.inGame){net.inGame=true;setLive()}
 $('#lobby').classList.add('hidden');$('#home').classList.add('hidden');
 if(r.state)receive(norm(r.state))}
function renderLobby(r){const seats=seatList(r),humans=seats.filter(Boolean).length,host=r.host===net.uid,g=r.game||'ludo';
 const link=location.origin+location.pathname+'?room='+net.code;const total=r.fill?4:humans;
 const others=liveList.filter(x=>x.uid!==net.uid&&x.state!=='playing'&&!seats.some(s=>s&&s.uid===x.uid));
 $('#lob').innerHTML=`<h2>${esc(t('roomT',{c:net.code}))}</h2><p class="note">${esc(t('lobbyInfo',{g:gName(g),m:modeName(r.mode)}))}</p>
 <div class="share"><input class="inp" readonly value="${esc(link)}" id="slink" aria-label="Invite link"><button class="btn" id="cpy">${esc(t('copy'))}</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t('waText',{g:gName(g),c:net.code})+'\n'+link)}">WhatsApp</a></div>
 <ul class="seats">${seats.map((s,i)=>`<li><span class="sw" style="background:${P[i].c}"></span>${s?avatar(s.photo)+`<b>${esc(s.name)}</b>${s.uid===r.host?` <small>${esc(t('host'))}</small>`:''}${s.uid===net.uid?` <small>${esc(t('youTag'))}</small>`:''}`:`<span class="mute">${esc(t(r.fill?'botSeat':'emptySeat'))}</span>`}</li>`).join('')}</ul>
 ${host?`<label class="chk"><input type="checkbox" id="lfill" ${r.fill?'checked':''}> ${esc(t('fillBots'))}</label>`:''}
 ${others.length&&humans<4?`<p class="lbl">${esc(t('inviteLive'))}</p><ul class="live">${others.slice(0,6).map(x=>`<li>${avatar(x.photo)}<span class="nm">${esc(x.name)}</span><button class="btn sm" data-inv="${esc(x.uid)}">${esc(t('invShort'))}</button></li>`).join('')}</ul>`:''}
 ${host?`<button class="big" id="lgo" ${total>=2?'':'disabled'}>${esc(t('startN',{n:total}))}</button>`:`<p class="note">${esc(t('waitHost'))}</p>`}
 <button class="btn" id="lleave" style="width:100%;margin-top:8px">${esc(t('leave'))}</button>`;
 $('#cpy').onclick=async()=>{try{await navigator.clipboard.writeText(link);$('#cpy').textContent=t('copied')}catch(e){$('#slink').select()}};
 if(host){$('#lfill').onchange=e=>net.ref.update({fill:e.target.checked});$('#lgo').onclick=hostStart}
 $('#lleave').onclick=leaveRoom;
 $('#lob').querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent=t('sent');sendInvite(b.dataset.inv).catch(onlErr)})}
function hostStart(){const r=net.room;const seats=seatList(r);
 const players=seats.map(s=>s?{on:true,bot:false,name:s.name,photo:s.photo||null,uid:s.uid}:r.fill?{on:true,bot:true,name:''}:{on:false});
 if(players.filter(x=>x.on).length<2)return;
 net.ref.update({status:'playing',state:clone(newState(r.game||'ludo',players,r.mode,now()))})}
function leaveRoom(){if(!net)return;const host=net.host===net.uid,ref=net.ref,dc=net.dc;leaveNet();if(host)ref.remove();else if(dc)ref.child('seats/'+dc).remove();openHome('online')}
function leaveNet(){if(!net)return;net.ref.off();if(net.dc)net.ref.child('seats/'+net.dc).onDisconnect().cancel();net=null;setLive();
 try{history.replaceState(null,'',location.pathname)}catch(e){}$('#roomtag').hidden=true}

/* ---------- Controls ---------- */
$('#newg').onclick=()=>{A();openHome(net?'online':null)};
$('#ragain').onclick=()=>{if(net){if(amHost()){$('#result').classList.add('hidden');net.ref.update({status:'lobby',state:null})}else{leaveRoom()}return}openHome()};
$('#rclose').onclick=()=>$('#result').classList.add('hidden');
$('#snd').onclick=()=>{muted=!muted;$('#snd').textContent=t(muted?'soundOff':'soundOn');if(!muted){A();sfx.turn()}};
diceEl.onclick=()=>{A();if(!S){openHome();return}if(isMine(S.turn))doRoll()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#home').classList.contains('hidden'))$('#home').classList.add('hidden');else $('#result').classList.add('hidden');return}
 if(e.code==='Space'&&S&&!S.over&&$('#home').classList.contains('hidden')&&!/INPUT|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();if(isMine(S.turn))doRoll()}});
cv.addEventListener('pointerdown',e=>{if(!S||S.game==='snake'||S.phase!=='move'||!isMine(S.turn)||animating||busy)return;A();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*15,y=(e.clientY-r.top)/r.height*15;let best=null,bd=.85;
 S.mv.forEach(k=>{const dp=DR[S.turn*4+k];if(!dp)return;const dd=Math.hypot(dp[0]-x,dp[1]-y);if(dd<bd){bd=dd;best=k}});if(best!==null)doMove(best)});
setInterval(()=>{if(!S)return;const el=$('#timer'),tm=now();
 if(S.mode==='race'){const rem=Math.max(0,S.endAt-tm);if(!S.over)el.textContent=fmt(rem);el.classList.toggle('low',rem<30000&&!S.over);if(rem<=0&&!S.over&&!busy&&amHost()){busy=true;commit(eTimeUp(S))}}
 else if(!S.over)el.textContent=fmt(tm-S.t0);
 const tt=$('#tt');
 if(net&&!S.over){const pl=S.players[S.turn];const left=Math.max(0,30-Math.floor((Date.now()-lastChange)/1000));tt.textContent=pl.bot?'':t('turnTime',{s:left});
  if(left===0&&amHost()&&!animating&&!busy&&!pl.bot){if(S.phase==='roll')doRoll();else if(S.phase==='move')doMove(botPick(S))}}
 else tt.textContent=''},250);
showDice(6);applyLang();resize();requestAnimationFrame(loop);
if(new URLSearchParams(location.search).get('room'))setTab('online');
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
